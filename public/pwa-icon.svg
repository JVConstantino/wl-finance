<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="finGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="50%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <rect width="512" height="512" rx="128" fill="url(#finGrad)" />
  
  <g filter="url(#shadow)" transform="translate(64, 64) scale(0.75)">
    <!-- Wallet Icon Frame -->
    <rect x="40" y="80" width="432" height="320" rx="48" fill="#ffffff" opacity="0.95" />
    
    <!-- Accent Line -->
    <path d="M40 180 H472" stroke="#e2e8f0" stroke-width="8" stroke-dasharray="12 12" />
    
    <!-- Flap with glowing lock -->
    <rect x="300" y="190" width="172" height="100" rx="32" fill="#2563eb" />
    <circle cx="360" cy="240" r="18" fill="#ffffff" />
    <circle cx="360" cy="240" r="8" fill="#eab308" />
    
    <!-- Graph Accent -->
    <path d="M100 320 L160 260 L220 290 L300 210" fill="none" stroke="#10b981" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="300" cy="210" r="12" fill="#10b981" />
  </g>
</svg>
